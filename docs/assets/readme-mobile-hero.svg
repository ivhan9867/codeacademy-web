<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CodeAcademy Mobile — Native Android Web Development Learning Platform">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B1A"/>
      <stop offset="55%" stop-color="#0B152E"/>
      <stop offset="100%" stop-color="#0C2434"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="78%" cy="42%" r="44%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="88%" cy="22%" r="28%">
      <stop offset="0%" stop-color="#F5D77F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F5D77F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="64" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="60%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#F5D77F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="frameClip">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="300" fill="url(#bgGrad)"/>
    <rect width="1200" height="300" fill="url(#dotGrid)"/>
    <rect width="1200" height="300" fill="url(#tealGlow)"/>
    <rect width="1200" height="300" fill="url(#goldGlow)"/>

    <!-- Subtle Animated Astrolabe / Orbital Geometry (Right Side) -->
    <g transform="translate(970, 150)">
      <circle r="118" stroke="#F5D77F" stroke-opacity="0.14" stroke-width="1"/>
      <circle r="86" stroke="#2DD4BF" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="146" ry="44" transform="rotate(-20)" stroke="#F5D77F" stroke-opacity="0.2" stroke-width="1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle cx="118" cy="0" r="3.5" fill="#2DD4BF">
          <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Minimalist Code Card Inside Orbit -->
      <rect x="-56" y="-40" width="112" height="80" rx="14" fill="#0B132B" fill-opacity="0.9" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="-38" cy="-24" r="3" fill="#EF4444" fill-opacity="0.85"/>
      <circle cx="-27" cy="-24" r="3" fill="#F59E0B" fill-opacity="0.85"/>
      <circle cx="-16" cy="-24" r="3" fill="#10B981" fill-opacity="0.85"/>
      <text x="-38" y="6" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">&lt;/&gt;</text>
      <rect x="6" y="-10" width="32" height="4" rx="2" fill="#E2E8F0" fill-opacity="0.7"/>
      <rect x="6" y="0" width="24" height="4" rx="2" fill="#F5D77F" fill-opacity="0.8"/>
      <rect x="-38" y="20" width="56" height="4" rx="2" fill="#64748B" fill-opacity="0.6"/>
      <rect x="24" y="18" width="6" height="9" rx="1.5" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Left Brand Copy -->
    <g transform="translate(64, 62)">
      <rect x="0" y="0" width="224" height="28" rx="14" fill="#0F766E" fill-opacity="0.22" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#2DD4BF">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="29" y="18.5" fill="#CCFBF1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2">ANDROID · KOTLIN · COMPOSE</text>

      <text x="0" y="88" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">CodeAcademy Mobile</text>
      <rect x="0" y="106" width="290" height="2.5" rx="1.25" fill="url(#accentLine)"/>

      <text x="0" y="140" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Offline-first Front-End Web Development learning platform with</text>
      <text x="0" y="166" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">mobile Playground IDE, multimodal AI Tutor, and verifiable credentials.</text>
    </g>

    <!-- Subtle Hairline Outer Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" stroke="#334155" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>
